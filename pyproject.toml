[project]
name = "clinical-factflow"
version = "0.1.0"
description = "Controlled clinical multi-agent runs and atomic fact tracing"
requires-python = ">=3.11"
dependencies = ["pydantic>=2.10,<3", "PyYAML>=6,<7", "numpy>=1.26,<3"]

[project.optional-dependencies]
local = ["torch>=2.6", "transformers>=4.51,<5", "accelerate>=1.2", "sentence-transformers>=3.4,<6"]
quantized = ["bitsandbytes>=0.45"]
parquet = ["pyarrow>=18"]
dev = ["pytest>=8"]
report = ["scipy>=1.11,<2", "matplotlib>=3.9,<4", "pymupdf>=1.24,<2", "pypdf>=5,<7", "tokenizers>=0.20,<1"]

[project.scripts]
clinical-factflow = "clinical_factflow.cli:main"
factflow-pairs = "clinical_factflow.server_matching:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/clinical_factflow"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
