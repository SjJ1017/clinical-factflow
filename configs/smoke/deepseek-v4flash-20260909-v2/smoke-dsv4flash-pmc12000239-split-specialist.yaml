task_prompt: You are participating in a clinical case conference for research. Use the evidence visible in your
  current input. Distinguish observations from hypotheses, preserve uncertainty, and explain conflicts with peers.
  Produce a concise evidence-based assessment and one principal answer. Do not invent missing measurements. Return
  assessment and answer as JSON fields. At every round, provide an updated principal diagnosis in the answer field,
  even when evidence is incomplete. State uncertainty in the assessment and distinguish a provisional diagnosis
  from a confirmed diagnosis.
