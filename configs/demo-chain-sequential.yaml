# Complete run configuration. Prefer OpenCode API 2; no automatic credential fallback.
schema_version: 1
name: demo-chain-sequential
replicate: 0
dataset:
  adapter: canonical
  path: ../examples/synthetic-cases.jsonl
  evidence_dictionary: null
  task: final_diagnosis
  case_ids:
  - synthetic-fixture-001
  limit: null
  selection_seed: 42
  allow_remote_processing: true
  clinical_summary_stop: Auxiliary Examination
  clinical_include_impressions: false
agents:
- id: A
  role: Clinical assessment
  prompt: You are a clinician responsible for history, bedside examination and differential diagnosis. Identify
    which additional evidence is needed; explain how received reports affect your assessment.
  initial_context: ''
- id: B
  role: Imaging interpretation
  prompt: You are a clinician specializing in interpretation of imaging reports. Explain findings, their limitations
    and how they bear on the case; reconcile them with received evidence.
  initial_context: ''
- id: C
  role: Laboratory interpretation
  prompt: You are a clinician specializing in laboratory and pathology interpretation. Preserve units, thresholds,
    timing and pertinent negatives; explain how these affect the differential diagnosis.
  initial_context: ''
topology:
  kind: chain
  schedule: sequential
  hub: null
  order:
  - A
  - B
  - C
  edges: []
context:
  distribution: by_category
  assignments:
    A:
    - history
    - examination
    B:
    - imaging
    C:
    - laboratory
    - pathology
  evidence_visibility: every_round
  self_memory: all
  peer_memory: last
rounds: 3
max_parallel: 3
task_prompt: You are participating in a clinical case conference for research. Use the evidence visible in your
  current input. Distinguish observations from hypotheses, preserve uncertainty, and explain conflicts with peers.
  Produce a concise evidence-based assessment and one principal answer. Do not invent missing measurements. Return
  assessment and answer as JSON fields.
generation:
  model: deepseek-v4-flash
  base_url: https://opencode.ai/zen/go/v1
  api_key_env: OPENCODE_API_KEY_2
  temperature: 0.7
  max_tokens: 1600
  timeout_seconds: 120
  attempts: 3
  seed: null
  extra_body:
    thinking:
      type: disabled
    response_format:
      type: json_object
outcome:
  method: majority
  agent: null
  scoring: ungraded
extraction:
  max_parallel: 6
  model:
    model: minimax-m3
    base_url: https://opencode.ai/zen/go/v1
    api_key_env: OPENCODE_API_KEY_2
    temperature: 0.0
    max_tokens: 8000
    timeout_seconds: 120.0
    attempts: 3
    seed: null
    extra_body:
      thinking:
        type: disabled
    api_format: anthropic
  system_prompt: 'Extract every proposition expressed in text, including clinical observations, explicit inferences
    and recommendations. A proposition need not be true. Never add your own clinical inference. Return no truths
    inferred from the reference answer: no answer key is provided.


    Extract from text ONLY. No external context is provided. Resolve pronouns and omitted noun phrases only
    from the same text; if their referents are absent, preserve the ambiguity rather than filling it from medical
    knowledge. preserve names, patient identity, time, numbers, units, negation, hedges, conditions and scope.


    Worked examples:

    1. Text: "The patient has a left renal mass. It measures 4.2 cm." -> "The patient''s left renal mass measures
    4.2 cm." With only "It measures 4.2 cm." and no named referent, do not invent an organ, side, mass or diagnosis.

    2. Text: "No fever or cough was reported." -> "The patient reported no fever."; "The patient reported no
    cough." Each is negated, reported, observation.

    3. Text: "CT of the chest was performed. The scan is normal." -> "The patient''s chest CT is normal." Counterexample:
    if two scans are named in the same text, do not guess; retain the ambiguity and certainty=unclear.

    4. "Creatinine is 2.1 mg/dL and sodium is 128 mmol/L." -> two observations with original values and units.
    Do not change units or replace a value by "elevated".

    5. "B suggests pneumonia because of the opacity." -> "The patient may have pneumonia." (inference, reported,
    possible, attributed_to=B); "The opacity supports pneumonia in the patient." (inference, reported). Never
    turn a suspicion into a confirmed diagnosis.

    6. "The patient denies chest pain but the ECG suggests ischemia." -> separate negated observation and affirmed
    inference; do not copy one polarity to both.

    7. "If bleeding persists, consider endoscopy." -> one conditional recommendation. Do not assert that bleeding
    persists or endoscopy occurred.

    8. "The patient previously had hepatitis B." keeps the historical time. "The patient has hepatitis B" is
    not the same assertion.


    Atomicity: one independently assertable predicate per fact; distribute both/all over named entities; split
    apposition and lists. Counterexamples: "head and neck cancer", "salt and pepper appearance", "Bosnia and
    Herzegovina", a joint necessary condition, a numeric range and "X or Y may explain this" are not separate
    affirmed facts. Do not split a diagnostic disjunction into confirmed diagnoses.

    Strip a superficial speaker wrapper from text but store the reporting act in attribution and attributed_to.
    Preserve epistemic hedges in text. "The report does not include a creatinine result" is a claim about missing
    documentation, not a normal creatinine observation. "The patient reports no pain" remains reported rather
    than an objectively measured absence.

    kind: observation = reported/measured patient finding; inference = diagnostic/causal/evaluative conclusion
    expressed by speaker; recommendation = proposed test/treatment; general_knowledge = non-patient-specific
    medical proposition; discourse = substantive claim about a document or discussion.

    attribution: direct = speaker states it without attributing it; reported = explicitly attributes to patient/report/peer;
    unknown = indeterminate. This is not proof of actual copying. certainty: asserted/probable/possible/conditional/unclear.
    polarity: affirmed/negated. clinical_domain: history/examination/laboratory/imaging/pathology/diagnosis/treatment/other.
    These are occurrence annotations, not gold truth labels.

    Extract all propositions, including irrelevant ones. Skip greetings and purely organizational instructions.
    Keep each qualifying condition attached and list it in qualifiers. quote must be an exact nonempty span
    of text; several facts may share the same quote.


    clinical_domain is a nonempty ARRAY of unique labels. Select every domain explicitly concerned by this atomic
    proposition, not the speaker role, whole paragraph, or material partition. Use other only by itself when
    none fits. Domain rubric: history = demographics, reported symptoms, prior/present illness course and risk
    exposures; examination = bedside physical findings; laboratory = fluid/biochemical/serological tests; imaging
    = scan findings; pathology = tissue, gross specimen, histology or immunohistochemistry; diagnosis = explicit
    disease interpretation, diagnosis or differential; treatment = intervention, treatment response or recommendation.
    A finding is not automatically diagnosis merely because it is useful diagnostically. Historical wording
    alone does not add history to a laboratory, imaging, pathology or treatment proposition.

    Examples and counter-cases:

    - "The patient reports weakness." -> ["history"]. "Examination shows reduced muscle power." -> ["examination"].

    - "Serum sodium is 128 mmol/L." -> ["laboratory"], not diagnosis. "Low sodium supports adrenal insufficiency."
    -> ["laboratory", "diagnosis"].

    - "CT shows a left renal mass." -> ["imaging"]. "The CT pattern favors renal carcinoma." -> ["imaging",
    "diagnosis"].

    - "Biopsy shows spindle cells." -> ["pathology"], not laboratory just because a laboratory processed the
    sample. "Biopsy supports sarcoma." -> ["pathology", "diagnosis"].

    - "Pain persisted despite aspirin." -> ["history", "treatment"]. "Aspirin was started six months ago." ->
    ["treatment"], retaining the time in the proposition.

    - "The patient may have pneumonia." -> ["diagnosis"], without adding an unstated evidence domain.

    Re-evaluate each child''s domains after atomization. "CT shows a mass and sodium is low" splits into imaging-only
    and laboratory-only facts, not two facts both labeled imaging+laboratory.


    Do not reconstruct another message. A peer attribution in text is not permission to retrieve or infer what
    that peer said. Keep analysis brief; make one pass and return the JSON without repeated alternative drafts.
    This instruction does not set a provider reasoning-token budget.'
  atomize_prompt: 'Check EVERY parent for incomplete reference resolution, attribution wrappers and compound
    predicates. Use original_text alone to resolve references; no external context is provided. Never invent
    or add a new claim. Return every parent_id exactly once, with one or more parts. If unchanged, return it
    as one part. Each part must carry its own annotation, qualifiers and exact quote from original_text. Re-evaluate
    annotations after splitting; do not blindly inherit polarity or kind.


    Examples:

    "The patient has fever and cough." -> two observations: fever; cough.

    "The patient denies fever but pneumonia is possible." -> a negated reported observation of no fever; a possible
    affirmed inference of pneumonia.

    "A reports sodium is 128 mmol/L." -> "The patient''s sodium is 128 mmol/L." with attribution=reported and
    attributed_to=A, preserving measurement and unit.

    "CT suggests malignancy." -> "The patient''s CT suggests malignancy." Keep uncertainty: never "The patient
    has malignancy" as an asserted observation.

    "Both knees are swollen." -> "The patient''s left knee is swollen." and "The patient''s right knee is swollen."
    Do not also retain the quantified duplicate.


    Counterexamples: retain "head and neck cancer", "salt and pepper appearance", "Bosnia and Herzegovina",
    numeric ranges, joint conditions, and uncertainty disjunctions as appropriate. "CT does not describe the
    lymph nodes" is not "The patient''s lymph nodes are normal". Never weaken 12.3% to about 12%, drop a temporal
    qualifier, or infer an absent symptom from an unmentioned symptom. Keep the parent''s complete meaning across
    its parts, and keep all quotes even when spans overlap.


    clinical_domain is a nonempty ARRAY of unique labels. Select every domain explicitly concerned by this atomic
    proposition, not the speaker role, whole paragraph, or material partition. Use other only by itself when
    none fits. Domain rubric: history = demographics, reported symptoms, prior/present illness course and risk
    exposures; examination = bedside physical findings; laboratory = fluid/biochemical/serological tests; imaging
    = scan findings; pathology = tissue, gross specimen, histology or immunohistochemistry; diagnosis = explicit
    disease interpretation, diagnosis or differential; treatment = intervention, treatment response or recommendation.
    A finding is not automatically diagnosis merely because it is useful diagnostically. Historical wording
    alone does not add history to a laboratory, imaging, pathology or treatment proposition.

    Examples and counter-cases:

    - "The patient reports weakness." -> ["history"]. "Examination shows reduced muscle power." -> ["examination"].

    - "Serum sodium is 128 mmol/L." -> ["laboratory"], not diagnosis. "Low sodium supports adrenal insufficiency."
    -> ["laboratory", "diagnosis"].

    - "CT shows a left renal mass." -> ["imaging"]. "The CT pattern favors renal carcinoma." -> ["imaging",
    "diagnosis"].

    - "Biopsy shows spindle cells." -> ["pathology"], not laboratory just because a laboratory processed the
    sample. "Biopsy supports sarcoma." -> ["pathology", "diagnosis"].

    - "Pain persisted despite aspirin." -> ["history", "treatment"]. "Aspirin was started six months ago." ->
    ["treatment"], retaining the time in the proposition.

    - "The patient may have pneumonia." -> ["diagnosis"], without adding an unstated evidence domain.

    Re-evaluate each child''s domains after atomization. "CT shows a mass and sodium is low" splits into imaging-only
    and laboratory-only facts, not two facts both labeled imaging+laboratory.


    Parents are intermediate candidates, not independent evidence. Verify text AND qualifiers against original_text;
    do not promote an unsupported parent qualifier into a new fact. If a referent is missing, retain the ambiguity.
    Keep analysis brief and return the JSON without repeated alternative drafts.'
  atomize_batch_size: 20
  atomize: candidates_v1
matching:
  model: Qwen/Qwen3-14B
  revision: main
  dtype: bfloat16
  device: cuda
  batch_size: 16
  load_4bit: false
  local_files_only: true
  entailment_threshold: 5.28
  threshold_provenance: Inherited historical science-domain cutoff; not calibrated or validated for clinical facts.
  blocker_model: BAAI/bge-base-en-v1.5
  blocker_revision: main
  blocker_threshold: 0.62
  blocker_top_k: 12
  blocker_metric: max_cosine_containment
  system_prompt: 'You judge logical entailment between two statements.


    Question: if A is true, must B also be true?


    Answer YES only when B follows necessarily from A. Answer NO when B could be

    false while A is true, when B adds information A does not contain, or when the

    two concern different subjects.


    Do not consider whether either statement is actually true, and do not consider

    whether they are about the same topic. Judge entailment only.


    Reply with exactly one word: YES or NO.'
  user_template: 'A: {a}

    B: {b}'
  cluster_policy: complete_link
  backend: local_qwen
  hosted_model: null
  max_parallel: 3
